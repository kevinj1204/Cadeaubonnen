<!--
  The Light Portraits – cadeaubonnen-BACKOFFICE in WordPress
  Alleen gebruiken als de app op https://cadeaubon.thelightportraits.nl draait.
  Zet de WordPress-pagina op PRIVÉ (alleen zichtbaar als je in WordPress bent ingelogd).
  Plak dit in een blok "Aangepaste HTML".
-->
<iframe id="tlp-admin" src="https://cadeaubon.thelightportraits.nl/admin" title="Cadeaubonnen backoffice"
        style="width:100%;height:1400px;border:0;display:block;background:#131315;"></iframe>
<script>
  (function () {
    var f = document.getElementById('tlp-admin');
    var origin = new URL(f.src).origin;
    window.addEventListener('message', function (e) {
      if (e.origin !== origin || !e.data || e.data.type !== 'tlp-admin:height') return;
      if (e.data.height > 400) f.style.height = Math.ceil(e.data.height) + 'px';
    });
  })();
</script>
